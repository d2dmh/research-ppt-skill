<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Used only by render.py on Linux/macOS LibreOffice: map Office fonts to metric-close free fonts. -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <alias binding="same"><family>微软雅黑</family>
    <prefer><family>Microsoft YaHei</family><family>Noto Sans CJK SC</family><family>Source Han Sans SC</family><family>PingFang SC</family><family>WenQuanYi Micro Hei</family></prefer></alias>
  <alias binding="same"><family>Microsoft YaHei</family>
    <prefer><family>Noto Sans CJK SC</family><family>Source Han Sans SC</family><family>PingFang SC</family></prefer></alias>
  <alias binding="same"><family>Arial</family>
    <prefer><family>Liberation Sans</family><family>Arimo</family><family>Helvetica</family></prefer></alias>
  <alias binding="same"><family>Cambria Math</family>
    <prefer><family>STIX Two Math</family><family>Latin Modern Math</family><family>DejaVu Serif</family></prefer></alias>
</fontconfig>
